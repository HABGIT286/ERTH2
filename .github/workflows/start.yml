name: EARTHLINK PRO - Build and Start

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: earthlink-start
  cancel-in-progress: true

jobs:
  build-and-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout Project
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fix Dependencies
        run: |
          npm pkg set 'devDependencies.esbuild=^0.28.2'
          npm install --no-audit --no-fund

      - name: Build Website
        run: npx vite build --base=/

      - name: Build Backend
        run: |
          npx esbuild server.ts \
            --platform=node \
            --bundle \
            --format=esm \
            --outfile=server.js \
            --external:vite

      - name: Verify Build
        run: |
          test -f dist/index.html
          test -f server.js
          echo "Build files verified successfully"

      - name: Start Server
        run: |
          NODE_ENV=production PORT=3000 node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Test Backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/status; then
              echo "Backend is running successfully"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Backend failed to start"
              cat server.log
              exit 1
            fi

            sleep 2
          done

      - name: Test Website
        run: |
          curl --fail --show-error http://127.0.0.1:3000/ -o homepage.html
          grep -qi "EARTHLINK PRO" homepage.html
          echo "Website is responding successfully"

      - name: Keep Server Alive
        run: |
          PID=$(cat server.pid)

          while kill -0 "$PID" 2>/dev/null; do
            sleep 30
          done

          echo "Server stopped unexpectedly"
          cat server.log
          exit 1

      - name: Save Error Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: earthlink-server-logs
          path: server.log
          if-no-files-found: ignore
